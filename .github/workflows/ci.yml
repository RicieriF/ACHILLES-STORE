name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: achilles_store
          POSTGRES_USER: achilles
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U achilles -d achilles_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://achilles:ci_only@localhost:5432/achilles_store
      E2E_DATABASE_URL: postgres://achilles:ci_only@localhost:5432/achilles_store_e2e
      OPERATOR_DATABASE_URL: postgres://achilles:ci_only@localhost:5432/achilles_store
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000
      JWT_SECRET: ci_placeholder_only_minimum_24_chars
      COOKIE_SECRET: ci_placeholder_only_minimum_24_chars
      BUSINESS_LOCALE: pt-BR
      DISPLAY_TIMEZONE: America/Sao_Paulo
      APP_ENV: test
      PUBLIC_BASE_URL: http://localhost:9000
      STOREFRONT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm seed:dev
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
